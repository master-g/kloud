[package]
name = "kloud"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A minimal Claude Code implementation in Rust"
homepage = "https://github.com/master-g/kloud"
repository = "https://github.com/master-g/kloud"

[workspace]
members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[workspace.dependencies]
# Async traits
async-trait = "0.1.89"

# CLI
clap = { version = "4.5", features = ["derive", "env", "unicode", "wrap_help"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.8", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }

futures = "0.3"
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"
directories = "6.0"
dotenvy = "0.15.7"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
regex = "1.12"
walkdir = "2.5"
url = "2.5.8"
fastrand = "2.3.0"
pulldown-cmark = "0.12"
syntect = "5.2"

[workspace.lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
ptr_as_ptr = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
async-trait.workspace = true
clap.workspace = true
futures.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
ratatui.workspace = true
crossterm.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
dotenvy.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
walkdir.workspace = true
url.workspace = true
fastrand.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true

# Unicode width for cursor positioning
unicode-width = "0.2"

# Memory
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios", target_os = "android"))'.dependencies]
mimalloc = { version = "0.1.48", default-features = false }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tikv-jemallocator = "0.6.1"

[dev-dependencies]
tempfile = "3"
test-log = { version = "0.2.19", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true

# bin
[profile.release]
opt-level = "s"
debug = false
strip = "debuginfo"
lto = true
panic = "abort"
codegen-units = 1

[profile.bench]
opt-level = 3
debug = true

[[example]]
name = "echo"
path = "examples/echo.rs"

[[example]]
name = "streaming"
path = "examples/streaming.rs"
